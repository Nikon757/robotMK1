# depthai_ros_driver (2.12.x, ROS 2 Jazzy apt) parameters for the OAK-D Lite on RobotMK1.
# RGB 1080p ISP-scaled 1/3 -> 640x360 @ 15 fps; depth from the 480p mono pair, aligned to RGB.
/oak:
  ros__parameters:
    camera:
      i_pipeline_type: RGBD
      i_nn_type: none
      i_enable_imu: true
      i_enable_ir: false              # OAK-D Lite has no IR projector / flood light
      i_enable_sync: true
      i_usb_speed: SUPER
      i_enable_diagnostics: false
    rgb:
      i_resolution: "1080P"
      i_fps: 15.0
      i_set_isp_scale: true
      i_isp_num: 1
      i_isp_den: 3
      i_width: 640
      i_height: 360
      i_output_isp: true
      i_publish_topic: true
      i_synced: true
      i_enable_lazy_publisher: false
    left:
      i_resolution: "480P"
      i_fps: 15.0
    right:
      i_resolution: "480P"
      i_fps: 15.0
    stereo:
      i_align_depth: true
      i_width: 640
      i_height: 360
      i_depth_preset: HIGH_DENSITY
      i_subpixel: true
      i_lr_check: true
      i_extended_disp: false
      i_stereo_conf_threshold: 230
      i_enable_speckle_filter: true
      i_speckle_filter_speckle_range: 50
      i_enable_spatial_filter: true
      i_spatial_filter_hole_filling_radius: 2
      i_enable_threshold_filter: true
      i_threshold_filter_min_range: 250
      i_threshold_filter_max_range: 6000
      i_publish_topic: true
      i_synced: true
      i_enable_lazy_publisher: false
    imu:
      i_acc_freq: 100
      i_gyro_freq: 100
      i_enable_rotation: false        # BMI270 has no rotation vector; imu_filter_madgwick computes it
      i_batch_report_threshold: 1
      i_max_batch_reports: 10
      i_message_type: IMU
      i_acc_cov: 0.01
      i_gyro_cov: 0.001
