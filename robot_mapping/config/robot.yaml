# ---------------------------------------------------------------------------
# RobotMK1 sensor & geometry configuration
#
# All frames follow ROS REP-103:  x forward, y left, z up.
# Distances are metres, angles are degrees.
# "mount" blocks give the pose of a sensor in the robot base frame
# (base_link = a point on the floor, under the centre of the rear axle).
# Rotation order for roll/pitch/yaw: R = Rz(yaw) * Ry(pitch) * Rx(roll).
#
# Values marked "MEASURE" must be checked against the real robot
# (see CALIBRATION.md).  Values marked "TOOL" are written by the calibration
# tools in tools/ - do not edit them by hand unless you know what you do.
# ---------------------------------------------------------------------------

serial:
  lidar_port: /dev/robot_lidar      # udev symlink (config/99-robot-usb.rules); falls back to auto-detect
  lidar_baud: 921600                # STL-27L = 921600, LD19/LD06 = 230400
  mcu_port: /dev/robot_mcu          # Niumo V5 board (CH340); falls back to auto-detect
  mcu_baud: 115200
  mcu_required: false               # true -> abort mapping if the STM32 board is not found

camera:
  model: OAK-D-LITE
  width: 640                        # RGB / aligned-depth output size (1080p ISP scaled 1/3)
  height: 360
  fps: 15
  depth_min_m: 0.25
  depth_max_m: 6.0
  imu_rate_hz: 100
  # RGB optical centre in base_link.  MEASURE: x forward of rear axle, z above floor.
  # pitch > 0 = camera looking down.
  mount: {x: 0.05, y: 0.0, z: 0.22, roll: 0.0, pitch: 0.0, yaw: 0.0}
  # Orientation of the OAK IMU chip w.r.t. the camera *body* frame (x fwd, y left, z up).
  # Batch dependent on OAK-D Lite!  TOOL: python run.py calib-imu   writes this.
  imu_rpy_deg: [0.0, 90.0, 0.0]
  imu_verified: false               # set to true by calib-imu after a successful alignment

lidar:
  model: STL27L                     # STL27L | LD19 | LD06
  # LiDAR rotation centre in base_link.  MEASURE.  Slightly in front of and below the camera.
  mount: {x: 0.12, y: 0.0, z: 0.15, roll: 0.0, pitch: 0.0, yaw: 0.0}
  forward_angle_deg: 0.0            # TOOL: raw sensor angle that points along robot +x (run.py lidar-view --find-forward)
  fov_deg: 180.0                    # keep only +-fov/2 around forward (rear half is blocked by the camera/body)
  clockwise: true                   # LDROBOT sensors count angles clockwise when viewed from above (mounted upright)
  min_range_m: 0.10
  max_range_m: 12.0
  min_intensity: 0                  # drop returns weaker than this (0..255); 0 = keep all

mapping:
  voxel_m: 0.03                     # map voxel size (fusion mapper) / export voxel filter
  keyframe_dist_m: 0.10
  keyframe_rot_deg: 10.0
  loop_search_radius_m: 2.0
  loop_min_index_gap: 15
  loop_min_inliers: 40
  min_hits: 2                       # voxels observed fewer times are dropped from the final map
  force_3dof: true                  # ground robot: x, y, yaw only.  --6dof overrides.
  ground_z_m: 0.03                  # occupancy grid: points below -> floor (free)
  obstacle_max_z_m: 0.60            # occupancy grid: points above -> ignored (robot can pass under)
  grid_resolution_m: 0.05
  depth_stride: 2                   # sub-sample depth image when back-projecting (2 = every 2nd pixel)

hailo:
  hef_path: models/yolov8s.hef      # compiled for Hailo-8 (NOT Hailo-8L); see DEPENDENCIES.md
  score_threshold: 0.40
  every_n_frames: 3                 # run detection every N camera frames
  box_dilate_px: 12                 # grow dynamic-object boxes before masking depth
  # COCO classes treated as dynamic -> their depth pixels are never integrated into the map
  dynamic_classes: [person, bicycle, car, motorcycle, bus, train, truck, bird, cat, dog, horse, sheep, cow]
  # COCO classes kept as semantic labels on map points (everything else = label 0)
  label_classes: [chair, couch, potted plant, bed, dining table, toilet, tv, laptop, refrigerator, oven,
                  microwave, sink, book, clock, vase, suitcase, backpack, bench, bottle, cup, keyboard]
